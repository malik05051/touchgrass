name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: TouchGrass-Windows
            file: dist/TouchGrass.exe
          - os: ubuntu-latest
            artifact: TouchGrass-Linux
            file: dist/TouchGrass
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -c "import pygame, touchgrass; pygame.init(); g = touchgrass.Game(pygame.display.set_mode((touchgrass.WIDTH, touchgrass.HEIGHT))); g.start_game(); [g.update(1/60) for _ in range(3700)]; g.draw(); assert g.state == 'gameover'"
      - name: Build executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name TouchGrass touchgrass.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}
